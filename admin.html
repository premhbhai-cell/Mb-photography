<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Panel — MB Photography</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:#f0f0f1;color:#1d2327}a{color:#2271b1}
#lg{min-height:100vh;display:flex;align-items:center;justify-content:center}#lg form{background:#fff;padding:28px;width:min(360px,92vw);box-shadow:0 1px 3px #0003;border-radius:4px}#lg img{display:block;max-width:180px;margin:0 auto 18px}#lg label{font-weight:600;display:block;margin:12px 0 4px}#lg input{width:100%;padding:9px;border:1px solid #8c8f94;border-radius:3px;font-size:15px}
.b{background:#2271b1;color:#fff;border:0;padding:9px 16px;border-radius:3px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-block}.b:hover{background:#135e96}.b.r{background:#d63638}.b.g{background:#f6f7f7;color:#2271b1;border:1px solid #2271b1}.err{color:#d63638;margin-top:10px;min-height:20px}
#app{display:none}#top{position:fixed;top:0;left:0;right:0;height:42px;background:#1d2327;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:5}#top a{color:#c3c4c7;text-decoration:none;margin-left:14px}
#side{position:fixed;top:42px;bottom:0;left:0;width:200px;background:#23282d;padding-top:8px;z-index:4}#side a{display:block;padding:11px 16px;color:#c3c4c7;text-decoration:none;cursor:pointer}#side a:hover{background:#191e23;color:#00b9eb}#side a.on{background:#2271b1;color:#fff}
#main{margin:42px 0 0 200px;padding:22px}h1{font-weight:400;font-size:23px;margin:0 0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}.box{background:#fff;border:1px solid #c3c4c7;padding:16px;border-radius:3px}.box b{font-size:28px;display:block}
table{width:100%;background:#fff;border:1px solid #c3c4c7;border-collapse:collapse}td,th{padding:11px 12px;text-align:left;border-bottom:1px solid #eee}th{background:#f6f7f7}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}.mg div{background:#fff;border:1px solid #c3c4c7;padding:6px;border-radius:3px}.mg img{width:100%;height:105px;object-fit:cover;display:block}.mg small{display:block;margin:6px 0;word-break:break-all;color:#646970}
#ed{position:fixed;top:42px;left:200px;right:0;bottom:0;background:#fff;display:none;z-index:6}#ed iframe{width:100%;height:100%;border:0}
@media(max-width:780px){#side{width:100%;height:auto;bottom:auto;display:flex;overflow-x:auto;top:42px}#side a{white-space:nowrap}#main{margin:92px 0 0}#ed{left:0;top:42px}}
</style></head><body>
<div id="lg"><form id="lf"><img src="assets/img/logo.png" alt=""><h2 style="text-align:center;margin:0 0 6px">Admin Login</h2><label>Email</label><input type="email" id="em" required autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"><label>Password</label><input type="password" id="pw" required autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false"><label style="font-weight:400;margin:8px 0 0"><input type="checkbox" id="sp" style="width:auto;margin-right:6px" onchange="document.getElementById('pw').type=this.checked?'text':'password'">Password dikhayein</label><div class="err" id="er"></div><button class="b" style="width:100%">Log In</button><p style="text-align:center;margin:14px 0 0"><a href="index.html">← Website par wapas</a></p></form></div>
<div id="app"><div id="top"><b>📸 MB Photography — Admin</b><span><a href="index.html" target="_blank">Visit Site</a><a href="#" id="lo">Log Out</a></span></div>
<div id="side"><a data-v="dash" class="on">📊 Dashboard</a><a data-v="pages">📄 Pages (Edit)</a><a data-v="rev">⭐ Google Reviews</a><a data-v="pay">📞 Contact &amp; Details</a><a data-v="media">🖼 Media Library</a><a data-v="set">⚙️ Settings (GitHub)</a></div>
<div id="main"></div><div id="ed"><iframe id="fr"></iframe></div></div>
<script src="settings.js?v=2"></script><script src="js/reviews.js"></script><script src="cms-core.js?v=2"></script><script>
var P=[["index", "Home Page"], ["pre-weddings", "Pre-Weddings"], ["weddings", "Weddings"], ["films", "Films"], ["maternity", "Maternity"], ["kids", "Kids"], ["contact", "Contact"]];
function shrink(f,cb){var i=new Image(),u=URL.createObjectURL(f);i.onload=function(){var s=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.85))};i.onerror=function(){alert('Image padh nahi payi')};i.src=u}
var $=function(i){return document.getElementById(i)};
function boot(){$('lg').style.display='none';$('app').style.display='block';view('dash')}
if(typeof api=='function')api('/api/me').then(boot).catch(function(){});
$('lf').onsubmit=function(e){e.preventDefault();$('er').textContent='';if(typeof api!='function'||typeof CMS=='undefined'){$('er').textContent='cms-core.js load nahi hua. Zip ki saari files (cms-core.js, cms.js, editor.js, settings.js) upload karein aur Ctrl+F5 dabayein.';return}try{api('/api/login',{method:'POST',body:JSON.stringify({email:$('em').value,password:$('pw').value})}).then(boot).catch(function(x){$('er').textContent=x.error||'Login fail'})}catch(x){$('er').textContent=x.message||'Login fail'}};
$('lo').onclick=function(e){e.preventDefault();api('/api/logout',{method:'POST'}).then(function(){location.href='index.html'})};
document.querySelectorAll('#side a').forEach(function(a){a.onclick=function(){view(a.dataset.v)}});
window.addEventListener('message',function(e){if(e.data=='cms-exit'){$('ed').style.display='none';$('fr').src='about:blank';view('pages')}});
function edit(p){$('fr').src=p+'.html?edit=1&t='+Date.now();$('ed').style.display='block'}
function view(v){document.querySelectorAll('#side a').forEach(function(a){a.classList.toggle('on',a.dataset.v==v)});var m=$('main');if(v=='pay')return payView(m);if(v=='rev')return revView(m);
 if(v=='dash'){Promise.all([api('/api/pages'),api('/api/media')]).then(function(r){m.innerHTML='<h1>Dashboard</h1><div class="cards"><div class="box"><b>'+P.length+'</b>Total Pages</div><div class="box"><b>'+r[0].length+'</b>Pages edited by you</div><div class="box"><b>'+r[1].length+'</b>Images in library</div></div><p>Kaise use karein: <b>Pages</b> me kisi page par <b>Edit</b> dabayein → text par seedha click karke likhein, kisi section/card/image par click karke use <b>Change Image / Duplicate / Delete / Move</b> karein → <b>Save</b>. GitHub connect hone par (Settings) changes sabke liye live ho jate hain.</p><p><button class="b" onclick="view(\'pages\')">Pages Edit Karein</button> <button class="b g" onclick="view(\'media\')">Media Library</button></p>'})}
 else if(v=='pages'){api('/api/pages').then(function(r){var u={};r.forEach(function(x){u[x.page]=x.updated});m.innerHTML='<h1>Pages</h1><table><tr><th>Page</th><th>Status</th><th>Actions</th></tr>'+P.map(function(p){return'<tr><td><b>'+p[1]+'</b></td><td>'+(u[p[0]]?'Edited '+new Date(u[p[0]]).toLocaleString():'Original')+'</td><td><button class="b" onclick="edit(\''+p[0]+'\')">✏️ Edit</button> <a class="b g" href="'+p[0]+'.html" target="_blank">View</a></td></tr>'}).join('')+'</table>'})}
 else if(v=='set'){var c=CMS.cfg()||{};m.innerHTML='<h1>Settings — Sabko live dikhane ke liye</h1><div class="box" style="max-width:640px"><p>Jab tak GitHub connect nahi hai, edits <b>sirf is browser</b> me dikhenge. Connect karne ke baad Save par changes aapke GitHub repo me jayenge aur hosting (Vercel / Netlify / GitHub Pages) unhe <b>sabke liye live</b> kar dega (~1 min).</p><p><b>Token kaise banayein:</b> GitHub → Settings → Developer settings → Personal access tokens → Fine-grained → apni repo chunein → Permissions: <b>Contents = Read and write</b>.</p><label>Repo (username/repo-name)</label><input id="g1" style="width:100%;padding:8px" value="'+(c.repo||'')+'"><label>GitHub Token</label><input id="g2" type="password" style="width:100%;padding:8px" value="'+(c.token||'')+'"><p><button class="b" id="gs">Test &amp; Save</button> <button class="b r" id="gx">Disconnect</button></p><div id="gm"></div></div>';$('gs').onclick=function(){var cfg={repo:$('g1').value.trim(),token:$('g2').value.trim(),branch:'main'};localStorage.setItem('cms_gh',JSON.stringify(cfg));CMS.gh('').then(function(r){if(!r)throw{error:'Repo nahi mili'};cfg.branch=r.default_branch;localStorage.setItem('cms_gh',JSON.stringify(cfg));$('gm').innerHTML='✅ Connected: '+r.full_name+' (branch '+r.default_branch+')'}).catch(function(x){localStorage.removeItem('cms_gh');$('gm').innerHTML='❌ '+(x.error||'Fail')})};$('gx').onclick=function(){localStorage.removeItem('cms_gh');view('set')}}
 else{m.innerHTML='<h1>Media Library</h1><p><label class="b">⬆ Image Upload karein<input type="file" id="mf" accept="image/*" multiple hidden></label></p><div class="mg" id="mg">Loading...</div>';$('mf').onchange=function(){Promise.all([].map.call(this.files,function(f){return new Promise(function(ok){shrink(f,function(data){api('/api/upload',{method:'POST',body:JSON.stringify({name:f.name,data:data})}).then(ok).catch(function(e){alert(e.error);ok()})})})})).then(function(){view('media')})};
 api('/api/media').then(function(l){$('mg').innerHTML=l.map(function(x){return'<div><img src="'+x.url+'" loading="lazy"><small>'+x.url+'</small>'+(x.up?'<button class="b r" onclick="del(\''+x.url.split('/').pop()+'\')">Delete</button>':'')+'</div>'}).join('')})}}

function S0(){try{var l=JSON.parse(localStorage.getItem('cms_settings'));if(l)return l}catch(e){}return JSON.parse(JSON.stringify(window.SETTINGS||{}))}
function msg(r){alert(r.local?'Saved — abhi sirf is browser me. Sabko live dikhane ke liye Settings (GitHub) connect karein.':'Saved ✔ GitHub par gaya, ~1 minute me live site par dikhega.')}
function ov(h){var o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#000b;z-index:50;overflow:auto;padding:4vh 10px';o.innerHTML='<div style="background:#fff;max-width:640px;margin:auto;padding:18px;border-radius:6px">'+h+'</div>';document.body.appendChild(o);return o}
function pickMedia(cb){var o=ov('<b>Image chunein</b> <label class="b" style="float:right">⬆ Nayi upload<input type="file" accept="image/*" hidden id="pf"></label><div class="mg" id="pg" style="margin-top:14px;clear:both">Loading...</div><p><button class="b g" id="pc">Close</button></p>');
o.querySelector('#pc').onclick=function(){o.remove()};o.querySelector('#pf').onchange=function(){var f=this.files[0];if(!f)return;shrink(f,function(d){api('/api/upload',{method:'POST',body:JSON.stringify({name:f.name,data:d})}).then(function(j){o.remove();cb(j.url)}).catch(function(e){alert(e.error)})})};
api('/api/media').then(function(l){var g=o.querySelector('#pg');g.innerHTML=l.map(function(x){return'<div style="cursor:pointer"><img src="'+x.url+'"></div>'}).join('');[].forEach.call(g.children,function(c,i){c.onclick=function(){o.remove();cb(l[i].url)}})})}
function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;').replace(/</g,'&lt;')}
function payView(m){var S=S0(),C=Object.assign({phone1:'9826398764',phone2:'9131327973',whatsapp:'919826398764'},S.contact||{});
m.innerHTML='<h1>Contact &amp; Details</h1><div class="box" style="max-width:640px"><label>Phone 1</label><input id="c1" value="'+esc(C.phone1)+'" style="width:100%;padding:8px"><label>Phone 2</label><input id="c2" value="'+esc(C.phone2)+'" style="width:100%;padding:8px"><label>WhatsApp (91 ke saath, jaise 919826398764) — enquiry yahin aati hai</label><input id="c3" value="'+esc(C.whatsapp)+'" style="width:100%;padding:8px"><p><button class="b" id="us">Save</button></p><small>Ye numbers poori website me (call/WhatsApp buttons, footer, contact page, enquiry form) apne aap badal jate hain. Address, Instagram, YouTube jaisi baaki cheezein Pages → Edit se badlein.</small></div>';
m.querySelector('#us').onclick=function(){var g=function(i){return m.querySelector('#'+i).value.trim()};S.contact={phone1:g('c1'),phone2:g('c2'),whatsapp:g('c3').replace(/\D/g,'')};CMS.saveSettings(S).then(msg).catch(function(x){alert(x.error)})}}
function revView(m){var S=S0(),L=Array.isArray(S.reviews)?S.reviews:JSON.parse(JSON.stringify(window.REVIEWS||[]));
function sv(){S.reviews=L;CMS.saveSettings(S).then(function(r){msg(r);revView(m)}).catch(function(x){alert(x.error)})}
m.innerHTML='<h1>Google Reviews <button class="b" id="ra">+ Add Review</button></h1><table><tr><th>Name</th><th>Date</th><th>Review</th><th></th></tr>'+L.map(function(r,i){return'<tr><td><b>'+esc(r.n)+'</b></td><td>'+esc(r.d)+'</td><td>'+esc(r.t)+'</td><td style="white-space:nowrap"><button class="b" data-e="'+i+'">Edit</button> <button class="b r" data-d="'+i+'">Delete</button></td></tr>'}).join('')+'</table>';
function form(i){var r=i<0?{n:'',d:new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}),t:''}:Object.assign({},L[i]);
var o=ov('<h2 style="margin-top:0">'+(i<0?'Add':'Edit')+' Review</h2><label>Name</label><input id="r1" value="'+esc(r.n)+'" style="width:100%;padding:8px"><label>Date (jaise 4 November 2026)</label><input id="r2" value="'+esc(r.d)+'" style="width:100%;padding:8px"><label>Review</label><textarea id="r3" rows="4" style="width:100%;padding:8px">'+esc(r.t)+'</textarea><p><button class="b" id="rs">Save</button> <button class="b g" id="rx">Cancel</button></p>');
o.querySelector('#rx').onclick=function(){o.remove()};
o.querySelector('#rs').onclick=function(){var g=function(n){return o.querySelector('#r'+n).value.trim()};if(!g(1)||!g(3))return alert('Name aur review zaroori hai');r.n=g(1);r.d=g(2);r.t=g(3);if(i<0)L.unshift(r);else L[i]=r;o.remove();sv()}}
m.querySelector('#ra').onclick=function(){form(-1)};m.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){form(+b.dataset.e)}});m.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){if(confirm('Ye review delete karein?')){L.splice(+b.dataset.d,1);sv()}}})}
function del(f){if(confirm('Ye image delete karein?'))api('/api/media?f='+encodeURIComponent(f),{method:'DELETE'}).then(function(){view('media')})}
</script></body></html>
